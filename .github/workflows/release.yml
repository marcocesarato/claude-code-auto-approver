name: Release

# Pushing a tag like v1.2.0 tests, builds the app with that version and publishes a
# GitHub release with the zipped app, the Windows scripts and their checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    working-directory: macos

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build the app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh

      - name: Package
        run: |
          cd build
          # ditto keeps the bundle's signature and extended attributes intact.
          ditto -c -k --sequesterRsrc --keepParent "Claude Code - Auto Approver.app" \
            "Claude-Code-Auto-Approver-${GITHUB_REF_NAME}-macOS.zip"
          (cd ../../windows && zip -qr "../macos/build/Claude-Code-Auto-Approver-${GITHUB_REF_NAME}-Windows.zip" .)
          shasum -a 256 *.zip > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.zip build/SHA256SUMS.txt \
            --title "Claude Code - Auto Approver ${GITHUB_REF_NAME}" --generate-notes
